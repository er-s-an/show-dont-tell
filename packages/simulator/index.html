<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Show, Don't Tell — Alexa+ experience simulator</title>
</head>
<body>
  <div class="device">
    <header class="topbar">
      <div class="brand">
        <div class="orb" aria-hidden="true"><div class="core"></div></div>
        <span class="wordmark">Alexa&#8202;+</span>
        <span class="sim-badge" title="This is a simulation of an Alexa+ experience, powered by a real MCP server">simulated</span>
      </div>
      <div class="topbar-right">
        <span class="day-chip" id="day-chip">Day 1</span>
        <button class="newday" id="new-day" title="Start the next morning — same memory">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          New day
        </button>
      </div>
    </header>

    <div class="status-banner" id="status" hidden>
      <span id="status-text">Connecting to the MCP server…</span>
      <button id="status-retry">Retry</button>
    </div>

    <main class="thread" id="thread"></main>

    <footer class="composer-wrap">
      <div class="chips" id="chips">
        <button class="chip">Plan a weekend in Napa for two</button>
        <button class="chip">Make it dog-friendly</button>
        <button class="chip">What did we book?</button>
      </div>
      <div class="composer">
        <button class="mic" id="mic" aria-label="Voice input (simulated)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="6" height="12" x="9" y="2" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 19v3"/></svg>
        </button>
        <input type="text" id="input" placeholder="Type to talk…" autocomplete="off" />
        <button class="send" id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </div>
    </footer>

    <div class="captions" id="captions" hidden></div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
