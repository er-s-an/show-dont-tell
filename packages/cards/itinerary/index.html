<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Trip Itinerary Card</title>
</head>
<body>
  <main class="main" id="root">
    <div class="card" id="card">
      <div class="hero" id="hero">
        <span class="hero-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span id="hero-where">Napa Valley · California</span>
        </span>
      </div>

      <header class="card-header">
        <div class="header-text">
          <div class="eyebrow reveal" style="--d:0ms">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
            Weekend Plan
          </div>
          <h1 id="trip-title" class="reveal" style="--d:60ms">Planning your weekend…</h1>
          <p class="subtitle reveal" style="--d:120ms" id="trip-subtitle"></p>
        </div>
        <div class="orb reveal" style="--d:180ms" aria-hidden="true"><div class="core"></div></div>
      </header>

      <section class="timeline-wrap reveal" style="--d:240ms" id="timeline"></section>

      <section class="hotels reveal" style="--d:340ms">
        <h2>Where to stay<small id="hotel-count"></small></h2>
        <div class="hotel-list" id="hotel-list"></div>
      </section>

      <div class="sheet" id="sheet" hidden>
        <div class="sheet-head">
          <strong id="sheet-title">Confirm booking</strong>
          <button class="sheet-x" id="sheet-x" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="sheet-rows" id="sheet-rows"></div>
        <div class="sheet-note" id="sheet-note"></div>
        <div class="sheet-actions">
          <button class="btn ghost" id="sheet-cancel">Not now</button>
          <button class="btn confirm" id="sheet-confirm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            Confirm &amp; book
          </button>
        </div>
      </div>

      <footer class="card-footer reveal" style="--d:440ms">
        <div class="total" id="total"></div>
        <div class="actions">
          <button class="btn ghost" id="dog-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4.5 0-7-2.5-7-5.5 0-2.2 1.6-4 3.5-4 1.1 0 1.9.6 3.5.6s2.4-.6 3.5-.6c1.9 0 3.5 1.8 3.5 4 0 3-2.5 5.5-7 5.5Z"/><circle cx="7.5" cy="8" r="1.4"/><circle cx="16.5" cy="8" r="1.4"/><circle cx="10" cy="5.5" r="1.4"/><circle cx="14" cy="5.5" r="1.4"/></svg>
            Make it dog-friendly
          </button>
          <button class="btn primary" id="book-btn">
            Book “Our pick”
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </div>
      </footer>

      <div class="confirmation" id="confirmation" hidden>
        <svg class="conf-ring" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="15.9155" pathLength="100"/>
          <path d="M11 18.5l4.5 4.5L25.5 12" pathLength="30"/>
        </svg>
        <div>
          <strong id="conf-hotel"></strong>
          <p id="conf-detail"></p>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
